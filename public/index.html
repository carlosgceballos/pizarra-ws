<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #ddd; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 12px; background: #fff; }
    #ip { width: 130px; }
    #puerto { width: 70px; }
    #estado { margin-left: auto; font-size: 14px; }
    main { display: flex; }
    canvas { display: block; background: #fff; touch-action: none; cursor: crosshair; }
    canvas.borrando { cursor: cell; }
    #botonBorrador.activo { background: #333; color: #fff; }
    aside { width: 220px; box-sizing: border-box; padding: 8px; background: #eee; overflow-y: auto; font-size: 14px; }
    aside h2 { font-size: 14px; margin: 0 0 6px; }
    #conectados { list-style: none; margin: 0 0 12px; padding: 0; }
    #conectados li { margin-bottom: 4px; }
    #videos p { margin: 0 0 2px; }
    #videos video { width: 100%; background: #000; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <form id="conexion">
      <label>IP <input id="ip" required></label>
      <label>Puerto <input id="puerto" type="number" min="1" max="65535" required></label>
      <button id="boton">Conectar</button>
    </form>
    <label>Color <input type="color" id="color" value="#000000"></label>
    <button id="botonBorrador">Borrador</button>
    <button id="botonLimpiar">Limpiar pizarra</button>
    <button id="botonCamara" disabled>Prender camara</button>
    <button id="botonMicro" disabled>Prender microfono</button>
    <span id="estado">Desconectado</span>
  </header>
  <main>
    <canvas id="pizarra"></canvas>
    <aside>
      <h2>Conectados</h2>
      <ul id="conectados"></ul>
      <div id="videos"></div>
    </aside>
  </main>

  <script src="/peerjs.min.js"></script>
  <script>
    const canvas = document.getElementById('pizarra');
    const ctx = canvas.getContext('2d');
    const inputColor = document.getElementById('color');
    const inputIp = document.getElementById('ip');
    const inputPuerto = document.getElementById('puerto');
    const boton = document.getElementById('boton');
    const botonCamara = document.getElementById('botonCamara');
    const botonMicro = document.getElementById('botonMicro');
    const estado = document.getElementById('estado');
    const panel = document.querySelector('aside');
    const listaConectados = document.getElementById('conectados');
    const videos = document.getElementById('videos');

    // Al cambiar el tamano el canvas se borra, por eso se copia lo dibujado y se vuelve a pintar
    function ajustarTamano() {
      const copia = document.createElement('canvas');
      copia.width = canvas.width;
      copia.height = canvas.height;
      if (copia.width && copia.height) copia.getContext('2d').drawImage(canvas, 0, 0);

      const alto = window.innerHeight - document.querySelector('header').offsetHeight;
      canvas.width = window.innerWidth - panel.offsetWidth;
      canvas.height = alto;
      panel.style.height = alto + 'px';
      if (copia.width && copia.height) ctx.drawImage(copia, 0, 0, canvas.width, canvas.height);
    }

    ajustarTamano();
    window.addEventListener('resize', ajustarTamano);

    // Si la pagina la entrego el servidor se proponen su IP y puerto
    const seguro = location.protocol === 'https:';
    if (seguro || location.protocol === 'http:') {
      inputIp.value = location.hostname;
      inputPuerto.value = location.port || (seguro ? 443 : 80);
    }

    let ws = null;
    let miId = null;
    let peer = null;          // conexion con el servidor de la libreria peer to peer
    let conexiones = [];      // ids que manda el servidor de senalizacion
    let camara = false;
    let micro = false;
    let miStream = null;      // lo que estoy compartiendo (camara, microfono o los dos)
    const salientes = new Map();   // id -> conexion por la que le mando mi stream
    const entrantes = new Map();   // id -> conexion por la que me llega el suyo

    document.getElementById('conexion').addEventListener('submit', (e) => {
      e.preventDefault();
      if (ws) {
        ws.close();
        return;
      }
      conectar(inputIp.value.trim(), inputPuerto.value);
    });

    function conectar(ip, puerto) {
      estado.textContent = `Conectando a ${ip}:${puerto}...`;
      // Si la pagina vino por https el WebSocket tambien tiene que ir cifrado
      ws = new WebSocket(`${seguro ? 'wss' : 'ws'}://${ip}:${puerto}`);

      ws.onopen = () => {
        estado.textContent = `Conectado a ${ip}:${puerto}`;
        boton.textContent = 'Desconectar';
        inputIp.disabled = inputPuerto.disabled = true;
      };

      ws.onclose = () => {
        estado.textContent = `Desconectado de ${ip}:${puerto}`;
        boton.textContent = 'Conectar';
        inputIp.disabled = inputPuerto.disabled = false;
        ws = null;
        salir();
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.tipo === 'trazo') dibujar(msg);
        else if (msg.tipo === 'limpiar') limpiar();
        else if (msg.tipo === 'bienvenida') registrar(ip, msg);
        else if (msg.tipo === 'lista') actualizarLista(msg.conexiones);
        else if (msg.tipo === 'listo') { if (miStream) compartirCon(msg.de); }
        else if (msg.tipo === 'apagado') dejarDeRecibir(msg.de);
      };
    }

    function enviar(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
    }

    // ---- Videollamada ----

    // El servidor me dio un id: con ese mismo me registro en el servidor de la libreria
    function registrar(ip, msg) {
      miId = msg.id;
      peer = new Peer('u' + miId, { host: ip, port: msg.puertoPeer, path: '/peerjs', secure: seguro });

      // Ya me pueden mandar video: aviso para que los que estan compartiendo me lo manden
      peer.on('open', () => {
        enviar({ tipo: 'listo' });
        botonCamara.disabled = botonMicro.disabled = false;
      });

      // Otro conectado me manda directo su camara o su microfono
      peer.on('call', (conexion) => {
        const de = Number(conexion.peer.slice(1));
        dejarDeRecibir(de);
        entrantes.set(de, conexion);
        conexion.on('stream', (stream) => mostrarVideo(de, `Usuario ${de}`, stream, false));
        conexion.answer();
      });

      peer.on('error', (err) => { estado.textContent = `Error en la videollamada: ${err.type}`; });
    }

    function actualizarLista(ids) {
      conexiones = ids;
      // Si alguien se fue se cierra lo que habia con el
      for (const id of [...salientes.keys(), ...entrantes.keys()]) {
        if (!ids.includes(id)) {
          dejarDeCompartirCon(id);
          dejarDeRecibir(id);
        }
      }
      listaConectados.innerHTML = '';
      for (const id of ids) {
        const li = document.createElement('li');
        li.textContent = id === miId ? `Usuario ${id} (yo)` : `Usuario ${id}`;
        listaConectados.append(li);
      }
    }

    botonCamara.addEventListener('click', () => { camara = !camara; reanudarVideos(); cambiarMedios(); });
    botonMicro.addEventListener('click', () => { micro = !micro; reanudarVideos(); cambiarMedios(); });

    // Al empezar a usar el microfono algunos navegadores pausan los videos que estaban sonando
    function reanudarVideos() {
      for (const video of videos.querySelectorAll('video')) {
        if (video.paused) video.play().catch(() => {});
      }
    }

    function pintarBotones() {
      botonCamara.textContent = camara ? 'Apagar camara' : 'Prender camara';
      botonMicro.textContent = micro ? 'Apagar microfono' : 'Prender microfono';
    }

    // El stream se pide una sola vez con camara y microfono, y se le manda a todos.
    // Despues los botones solo prenden o apagan cada pista, sin volver a conectar
    async function cambiarMedios() {
      botonCamara.disabled = botonMicro.disabled = true;

      if (!camara && !micro) {
        apagarStream();
        enviar({ tipo: 'apagado' });
      } else {
        const nuevo = !miStream;
        if (nuevo) await pedirStream();
        if (miStream) {
          // Por si el equipo no tiene camara o no tiene microfono
          camara = camara && miStream.getVideoTracks().length > 0;
          micro = micro && miStream.getAudioTracks().length > 0;
          miStream.getVideoTracks().forEach((t) => { t.enabled = camara; });
          miStream.getAudioTracks().forEach((t) => { t.enabled = micro; });

          if (camara) mostrarVideo('yo', 'Yo', miStream, true);
          else quitarVideo('yo');

          if (nuevo) {
            for (const id of conexiones) {
              if (id !== miId) compartirCon(id);
            }
          }
        }
      }

      reanudarVideos();
      pintarBotones();
      botonCamara.disabled = botonMicro.disabled = !peer;
    }

    async function pedirStream() {
      // El navegador solo deja usar la camara si la pagina se abrio en localhost o con https
      if (!navigator.mediaDevices) {
        estado.textContent = 'La camara y el microfono solo se pueden usar en localhost o con https';
        camara = micro = false;
        return;
      }
      try {
        miStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch {
        // Si no se pueden las dos cosas se intenta solo con lo que se prendio
        try {
          miStream = await navigator.mediaDevices.getUserMedia({ video: camara, audio: micro });
        } catch {
          estado.textContent = 'No se pudo usar la camara o el microfono';
          camara = micro = false;
        }
      }
    }

    // Conexion directa con el otro navegador, el servidor ya no interviene
    function compartirCon(id) {
      dejarDeCompartirCon(id);
      salientes.set(id, peer.call('u' + id, miStream));
    }

    function dejarDeCompartirCon(id) {
      const conexion = salientes.get(id);
      salientes.delete(id);
      if (conexion) conexion.close();
    }

    function dejarDeRecibir(id) {
      const conexion = entrantes.get(id);
      entrantes.delete(id);
      if (conexion) conexion.close();
      quitarVideo(id);
    }

    function apagarStream() {
      for (const id of [...salientes.keys()]) dejarDeCompartirCon(id);
      if (miStream) miStream.getTracks().forEach((t) => t.stop());
      miStream = null;
      quitarVideo('yo');
    }

    function mostrarVideo(id, nombre, stream, silenciado) {
      const texto = stream.getVideoTracks().length ? nombre : `${nombre} (solo audio)`;

      // El mismo stream avisa una vez por pista: si ya esta puesto no se vuelve a crear
      const actual = document.getElementById('video-' + id);
      if (actual && actual.querySelector('video').srcObject === stream) {
        actual.querySelector('p').textContent = texto;
        return;
      }

      quitarVideo(id);
      const caja = document.createElement('div');
      caja.id = 'video-' + id;
      const titulo = document.createElement('p');
      titulo.textContent = texto;
      const video = document.createElement('video');
      video.playsInline = true;
      video.muted = silenciado;
      video.srcObject = stream;
      caja.append(titulo, video);
      videos.append(caja);

      // Si el navegador lo pausa solo, se vuelve a intentar
      video.addEventListener('pause', () => {
        setTimeout(() => { if (video.isConnected && video.paused) video.play().catch(() => {}); }, 300);
      });

      // Algunos navegadores no dejan sonar un video si el usuario no ha tocado nada:
      // en ese caso se muestra sin sonido y con un boton para activarlo
      video.play().catch(() => {
        video.muted = true;
        video.play().catch(() => {});
        const activar = document.createElement('button');
        activar.textContent = 'Activar sonido';
        activar.onclick = () => { video.muted = false; video.play(); activar.remove(); };
        titulo.after(activar);
      });
    }

    function quitarVideo(id) {
      const caja = document.getElementById('video-' + id);
      if (caja) caja.remove();
    }

    function salir() {
      camara = micro = false;
      apagarStream();
      for (const id of [...entrantes.keys()]) dejarDeRecibir(id);
      if (peer) peer.destroy();
      peer = null;
      miId = null;
      pintarBotones();
      botonCamara.disabled = botonMicro.disabled = true;
      actualizarLista([]);
    }

    // ---- Pizarra ----

    // Las coordenadas viajan entre 0 y 1 para que se vean igual en pantallas de distinto tamano
    // Con el borrador la linea es mas gruesa y en vez de pintar quita lo que hay debajo
    function dibujar({ x1, y1, x2, y2, color, borrador }) {
      ctx.globalCompositeOperation = borrador ? 'destination-out' : 'source-over';
      ctx.strokeStyle = color;
      ctx.lineWidth = borrador ? 20 : 3;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1 * canvas.width, y1 * canvas.height);
      ctx.lineTo(x2 * canvas.width, y2 * canvas.height);
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    }

    function limpiar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    const botonBorrador = document.getElementById('botonBorrador');
    let borrando = false;

    botonBorrador.addEventListener('click', () => {
      borrando = !borrando;
      botonBorrador.classList.toggle('activo', borrando);
      canvas.classList.toggle('borrando', borrando);
    });

    // Al elegir un color se vuelve a dibujar
    inputColor.addEventListener('input', () => {
      if (borrando) botonBorrador.click();
    });

    // Limpia la pizarra de todos, no solo la mia
    document.getElementById('botonLimpiar').addEventListener('click', () => {
      if (!confirm('Se va a borrar la pizarra de todos los conectados. ¿Seguro?')) return;
      limpiar();
      enviar({ tipo: 'limpiar' });
    });

    let anterior = null;

    function punto(e) {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) / canvas.width, y: (e.clientY - r.top) / canvas.height };
    }

    canvas.addEventListener('pointerdown', (e) => { anterior = punto(e); });

    canvas.addEventListener('pointermove', (e) => {
      if (!anterior) return;
      const actual = punto(e);
      const trazo = { tipo: 'trazo', x1: anterior.x, y1: anterior.y, x2: actual.x, y2: actual.y, color: inputColor.value, borrador: borrando };
      dibujar(trazo);
      enviar(trazo);
      anterior = actual;
    });

    window.addEventListener('pointerup', () => { anterior = null; });
  </script>
</body>
</html>
